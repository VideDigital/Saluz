
name: SALUZ | Publicar versão de testes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saluz-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: saluz-homologacao

    env:
      CLOUDFLARE_ACCOUNT_ID: f84d79f13ae0a665e5046ebeb21ffddd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Baixar código da homologação
        uses: actions/checkout@v4
        with:
          ref: homologacao

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar testes
        run: node --test tests/*.test.mjs

      - name: Preparar arquivos públicos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          public = Path("saluz-public")
          public.mkdir(exist_ok=True)

          allowed = {
              ".html", ".css", ".js", ".svg",
              ".png", ".jpg", ".jpeg", ".webp",
              ".ico", ".txt", ".woff2", ".xml"
          }

          for item in Path(".").iterdir():
              if item.is_file() and (
                  item.suffix.lower() in allowed
                  or item.name in {"_headers", "_redirects", "robots.txt"}
              ):
                  shutil.copy2(item, public / item.name)

          assert (public / "index.html").exists()
          assert (Path("functions") / "api" / "[[path]].js").exists()
          PY

      - name: Publicar versão prévia
        run: |
          npx --yes wrangler@4 pages deploy saluz-public \
            --project-name saluz-loja \
            --branch homologacao
