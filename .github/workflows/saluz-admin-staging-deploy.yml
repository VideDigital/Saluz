name: SALUZ | Publicar painel na homologação (somente admin)

on:
  push:
    branches: [homologacao]
    paths:
      - '.github/workflows/saluz-admin-staging-deploy.yml'
      - '.github/scripts/build-saluz-admin-preview.py'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'admin-deploy/**'
      - 'saluz-admin-extras.js'
      - 'saluz-studio.js'
      - 'saluz-campaigns.js'
      - 'saluz-campaigns-simple.js'
      - 'saluz-campaigns-simple.css'
      - 'saluz-mobile.js'
      - 'saluz-admin-guide.js'
      - 'saluz-workspace-v2.js'
      - 'saluz-admin-v3.js'
      - 'saluz-admin-calm*.css'
      - 'saluz-*.css'
      - '_headers'
      - 'tests/admin-session-expiry.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saluz-staging-admin-only
  cancel-in-progress: false

jobs:
  deploy-admin:
    if: github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: saluz-homologacao
    env:
      CLOUDFLARE_ACCOUNT_ID: f84d79f13ae0a665e5046ebeb21ffddd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bloquear implantação sem credencial no ambiente SALUZ
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN como secret no GitHub Environment saluz-homologacao. Não envie o token por chat."
            exit 1
          fi

      - name: Validar autenticação e projeto existente
        run: |
          node --check admin.js
          node --check saluz-studio.js
          node --check saluz-campaigns.js
          node --test tests/*.test.mjs
          python3 tests/d1-orders-sqlite.py

      - name: Criar build publicável com proxy exclusivo do painel
        env:
          TARGET_DIR: ${{ runner.temp }}/saluz-admin-staging
        run: python3 .github/scripts/build-saluz-admin-preview.py "$TARGET_DIR"

      - name: Implantar estritamente no Pages saluz-admin — homologacao
        id: publish_preview
        working-directory: ${{ runner.temp }}/saluz-admin-staging
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy ./public \
            --project-name saluz-admin \
            --branch homologacao 2>&1 | tee "$RUNNER_TEMP/saluz-admin-publish.log"
          deployed_url="$(grep -oE 'https://[0-9a-f]{8}\.saluz-admin\.pages\.dev' "$RUNNER_TEMP/saluz-admin-publish.log" | head -n 1 || true)"
          if [[ ! "$deployed_url" =~ ^https://[0-9a-f]{8}\.saluz-admin\.pages\.dev$ ]]; then
            echo "::error::Não foi possível identificar a URL imutável do deploy de homologação."
            exit 1
          fi
          echo "url=$deployed_url" >> "$GITHUB_OUTPUT"

      - name: Verificar build imutável e propagação do alias sem autenticação
        env:
          DEPLOY_URL: ${{ steps.publish_preview.outputs.url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.request
          from urllib.error import HTTPError, URLError

          # The immutable deploy URL uniquely identifies the files just uploaded.
          # The public branch alias may temporarily resolve to the previous deploy.
          base = os.environ["DEPLOY_URL"].rstrip("/")
          assert re.fullmatch(r"https://[0-9a-f]{8}\.saluz-admin\.pages\.dev", base), "Invalid immutable deploy URL"
          alias = "https://homologacao.saluz-admin.pages.dev"
          headers = {"User-Agent": "SALUZ-Preview-CI/1.0",
                     "Accept": "text/html,application/javascript,*/*",
                     "Cache-Control": "no-cache"}
          def get(origin, path):
              last_error = None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(origin + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as response:
                          assert response.status == 200
                          return response.read().decode("utf-8")
                  except (HTTPError,URLError) as error:
                      last_error=error
                      if attempt < 3: time.sleep(2)
              raise RuntimeError("Preview file not accessible: "+path) from last_error

          # Obtain exact cache-busted asset names from the checked-out source.
          # Never hardcode versions here: content changes must not break a healthy deploy.
          from pathlib import Path
          local_html=Path("admin.html").read_text(encoding="utf-8")
          def expected_asset(name):
              rx=r'(?:src|href)="(\./'+re.escape(name)+r'\?v=[^"]+)"'
              match=re.search(rx,local_html)
              assert match is not None, "Referência de arquivo esperada ausente: "+name
              return match.group(1)
          current_refs={name:expected_asset(name) for name in (
              "saluz-professional.js","saluz-admin-v3.js","saluz-v3-theme.css","admin.js"
          )}
          html=get(base, "/admin.html")
          assert get(base, "/") == html, "A raiz do painel ainda não abre a administração"
          assert 'saluz-admin-polish.css?v=20261030-panel1' in html, "Camada visual profissional ausente"
          assert 'SALUZ-ADMIN-POLISH-V1' in get(base, "/saluz-admin-polish.css"), "CSS profissional não publicado"
          for name,reference in current_refs.items():
              assert reference in html, "Arquivo desatualizado no deploy: "+name
          assert 'saluz-campaigns-simple.js?v=20261030-simple1' in html, "Editor fácil não está no HTML"
          assert 'saluz-campaigns-simple.css?v=20261030-simple1' in html, "CSS do editor fácil não está no HTML"
          assert 'market-easy-content' in get(base, "/saluz-campaigns-simple.js"), "Editor fácil não foi publicado"
          assert 'market-easy-advanced' in get(base, "/saluz-campaigns-simple.css"), "CSS do editor fácil não foi publicado"
          js=get(base, "/admin.js")
          assert "invalidateAdminSession" in js and "ensureAdminResponse" in js
          assert "saluz-op-head" in get(base, "/saluz-admin-v3.js")
          assert "saluz-v3" in get(base, "/saluz-v3-home.css")
          assert "/api/migration-admin/store-health" in get(base, "/saluz-professional.js")
          print("SALUZ: arquivos V3 e resumo D1 confirmados no deploy imutável de Preview.")

          # Alias is tested separately. A stale edge alias must NOT hide a good
          # immutable deployment, but its pending propagation must be reported.
          alias_ready = False
          for attempt in range(8):
              try:
                  alias_html=get(alias,"/admin.html?ci="+os.environ["GITHUB_SHA"][:12]+"-"+str(attempt))
                  if current_refs["saluz-professional.js"] in alias_html:
                      alias_ready=True
                      break
              except (RuntimeError,AssertionError):
                  pass
              if attempt<7:time.sleep(3)
          if not alias_ready:
              print("::warning::O deploy imutável está correto, mas o alias de homologação ainda não serve o novo HTML. Conferir propagação antes de validar visualmente.")
          else:
              try:
                  req=urllib.request.Request(alias+"/api/migration-admin/store-health",
                                             headers={"Accept":"application/json"})
                  urllib.request.urlopen(req,timeout=30)
                  raise AssertionError("Resumo D1 ficou acessível sem administrador")
              except HTTPError as denied:
                  assert denied.code in (401,403), (
                      f"Rota privada sem login retornou {denied.code}; esperado 401/403"
                  )
                  if denied.code==403:
                      print("::notice::A consulta anônima foi bloqueada com HTTP 403 no edge ou na aplicação. A autorização interna já foi validada nos testes unitários.")
              print("SALUZ: alias atualizado; resumo D1 negou acesso sem login (401/403).")
          PY
