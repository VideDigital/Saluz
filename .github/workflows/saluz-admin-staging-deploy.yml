name: SALUZ | Publicar painel na homologação (somente admin)

on:
  push:
    branches: [homologacao]
    paths:
      - '.github/workflows/saluz-admin-staging-deploy.yml'
      - '.github/scripts/build-saluz-admin-preview.py'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'admin-deploy/**'
      - 'saluz-admin-extras.js'
      - 'saluz-studio.js'
      - 'saluz-campaigns.js'
      - 'saluz-mobile.js'
      - 'saluz-admin-guide.js'
      - 'saluz-workspace-v2.js'
      - 'saluz-admin-v3.js'
      - 'saluz-admin-calm*.css'
      - 'saluz-*.css'
      - '_headers'
      - 'tests/admin-session-expiry.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saluz-staging-admin-only
  cancel-in-progress: false

jobs:
  deploy-admin:
    if: github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: saluz-homologacao
    env:
      CLOUDFLARE_ACCOUNT_ID: f84d79f13ae0a665e5046ebeb21ffddd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bloquear implantação sem credencial no ambiente SALUZ
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN como secret no GitHub Environment saluz-homologacao. Não envie o token por chat."
            exit 1
          fi

      - name: Validar autenticação e projeto existente
        run: |
          node --check admin.js
          node --check saluz-studio.js
          node --check saluz-campaigns.js
          node --test tests/*.test.mjs
          python3 tests/d1-orders-sqlite.py

      - name: Criar build publicável com proxy exclusivo do painel
        env:
          TARGET_DIR: ${{ runner.temp }}/saluz-admin-staging
        run: python3 .github/scripts/build-saluz-admin-preview.py "$TARGET_DIR"

      - name: Implantar estritamente no Pages saluz-admin — homologacao
        working-directory: ${{ runner.temp }}/saluz-admin-staging
        run: |
          npx --yes wrangler@4 pages deploy ./public \
            --project-name saluz-admin \
            --branch homologacao

      - name: Confirmar URL e comportamento estático sem autenticação
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from urllib.error import HTTPError, URLError
          base = "https://homologacao.saluz-admin.pages.dev"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; SALUZ-Staging-Check/1.0)",
                     "Accept": "text/html,application/javascript,*/*"}
          def get(path):
              last_error = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          assert response.status == 200
                          return response.read().decode("utf-8")
                  except (HTTPError, URLError) as error:
                      last_error = error
                      if attempt < 3:
                          time.sleep(3)
              raise RuntimeError(f"Staging endpoint {path} unavailable") from last_error
          html = get("/admin.html")
          assert "admin.js?v=20261030-tab-return" in html, "Novo HTML ainda não servido"
          js = get("/admin.js")
          assert "invalidateAdminSession" in js and "ensureAdminResponse" in js
          assert "saluz-admin-v3.js?v=20261030-operacao3" in html, "HTML não aponta ao novo painel operacional"
          assert "saluz-v3-theme.css?v=20261030-operacao3" in html, "Tema operacional não foi carregado"
          assert "saluz-op-head" in get("/saluz-admin-v3.js"), "JS estrutural da nova visão geral ausente"
          assert "saluz-v3" in get("/saluz-v3-home.css"), "CSS operacional ausente"
          print("SALUZ V3: nova identidade e layout operacional ativos somente no Preview.")
          new_js = get("/saluz-professional.js")
          assert "/api/migration-admin/store-health" in new_js, "Resumo D1 ausente do painel"
          assert "saluz-professional.js?v=20261030-d1-health" in html, "Resumo desatualizado no HTML"
          try:
              req=urllib.request.Request(base+"/api/migration-admin/store-health",headers={"Accept":"application/json"})
              urllib.request.urlopen(req,timeout=30)
              raise AssertionError("Resumo D1 deve exigir login de administrador")
          except HTTPError as denied:
              assert denied.code == 401, f"Resumo D1: acesso sem sessão retornou {denied.code}, esperado 401"
          print("SALUZ Preview: dashboard D1 carregado e protegido por autorização 401.")
          PY
