name: SALUZ | Verificação pública da homologação
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-homologacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    name: API pública e painel protegido
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar ambiente público sem credenciais ou compras
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlencode

          BASE="https://saluz-loja.pages.dev"
          def get(path):
              req=Request(BASE+path,headers={"User-Agent":"Saluz-CI-Homologacao/1.0","Accept":"application/json,text/html"})
              try:
                  with urlopen(req,timeout=20) as res:
                      return res.status,res.read(250000).decode("utf-8","replace")
              except HTTPError as ex:
                  return ex.code,ex.read(250000).decode("utf-8","replace")

          code,text=get("/api/status")
          print("API status HTTP:",code)
          assert code==200, "API status indisponível"
          status=json.loads(text)
          assert status.get("configured") is True, "Cloudflare/Supabase ainda não configurados"
          assert status.get("checkout_enabled") is False, "Checkout não pode estar habilitado"
          assert status.get("orders_locked") is True, "Bloqueio técnico de pedidos não encontrado"
          print("API ativa; checkout bloqueado.")

          code,text=get("/api/products?"+urlencode({"page":1,"limit":24}))
          print("Catálogo HTTP:",code)
          assert code==200, "API de catálogo indisponível"
          catalog=json.loads(text)
          assert catalog.get("configured") is True
          assert isinstance(catalog.get("products"),list)
          assert catalog.get("page")==1
          assert catalog.get("limit")==24
          print("Catálogo público: resposta e paginação válidas.")

          code,text=get("/api/admin/products")
          print("Admin anônimo HTTP:",code)
          assert code==401, "API privada sem proteção adequada"
          print("API administrativa bloqueada para visitantes.")

          code,text=get("/admin.html")
          print("Painel HTML HTTP:",code)
          assert code==200 and "login-form" in text and "SALUZ" in text
          print("Página de login disponível.")

          code,text=get("/home-vitrine.js")
          print("Script vitrine HTTP:",code)
          assert code==200 and "featured-products" in text
          print("Arquivos atuais da Home disponíveis.")

          print("Homologação pública aprovada, sem dados privados.")
          PY
