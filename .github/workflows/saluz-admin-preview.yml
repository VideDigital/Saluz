name: SALUZ | Painel administrativo (preview)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/saluz-admin-preview.yml']
permissions:
  contents: read
concurrency:
  group: saluz-admin-preview
  cancel-in-progress: false
jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: saluz-homologacao
    env:
      CLOUDFLARE_ACCOUNT_ID: f84d79f13ae0a665e5046ebeb21ffddd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Carregar codigo testado da homologacao
        uses: actions/checkout@v4
        with:
          ref: homologacao
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e executar todos os testes
        run: |
          node --check admin.js
          node --check saluz-studio.js
          node --check saluz-campaigns.js
          node --check saluz-professional.js
          node --check functions/api/\[\[path\]\].js
          node --check admin-deploy/functions/api/\[\[path\]\].js
          node --check saluz-site-content.js
          node --check functions/api/mp-orders.mjs
          node --check saluz-mobile.js
          node --check loja.js
          node --check functions/api/\[\[path\]\].js
          node --check functions/api/migration-health.js
          node --check functions/api/migration-catalog.js
          node --check cloudflare/d1/repository.mjs
          node --check cloudflare/storage/kv-media.mjs
          node --check cloudflare/d1/staging-admin.mjs
          node --check migration-lab.js
          node --check migration-showcase.js
          node --test tests/migration-showcase.test.mjs
          test -f cloudflare/d1/0002_product_revision.sql
          node --test tests/*.test.mjs
          test -f functions/api/migration-health.js
          test -f functions/api/migration-catalog.js
      - name: Preparar e publicar a vitrine de homologacao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out = Path('saluz-public')
          out.mkdir(exist_ok=True)
          allowed = {'.html','.css','.js','.svg','.png','.jpg','.jpeg','.webp','.ico','.txt','.woff2','.xml'}
          for item in Path('.').iterdir():
            if item.is_file() and (item.suffix.lower() in allowed or item.name in {'_headers','_redirects','robots.txt'}):
              shutil.copy2(item,out/item.name)
          assert (out/'index.html').exists()
          PY
          npx --yes wrangler@4 pages deploy saluz-public --project-name saluz-loja --branch homologacao
      - name: Conferir conexao D1/KV no endpoint real de homologacao
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://homologacao.saluz-loja.pages.dev';
          async function get(path){
            let error;
            for(let attempt=0;attempt<6;attempt++){
              try{
                const res=await fetch(base+path,{headers:{accept:'application/json'},signal:AbortSignal.timeout(12000),cache:'no-store'});
                const data=await res.json();
                if(!res.ok)throw new Error(path+' HTTP '+res.status);
                return data;
              }catch(e){error=e;await new Promise(r=>setTimeout(r,1500));}
            }
            throw error;
          }
          const health=await get('/api/migration-health');
          assert.equal(health.ready,true,'D1 staging nao esta funcional');
          assert.equal(health.database_connected,true);
          assert.equal(health.media_connected,true);
          assert.equal(health.payments_enabled,false);
          const showcase=await fetch(base+'/migration-showcase.html',{cache:'no-store'});
          assert.equal(showcase.status,200,'Vitrine D1 nao publicada na homologacao');
          assert.match(await showcase.text(),/Vitrine D1 de testes/);
          const catalog=await get('/api/migration-catalog');
          assert.equal(catalog.source,'D1 staging');
          assert.equal(catalog.payments_enabled,false);
          assert.equal(catalog.demo_only,true);
          // Validar as MESMAS APIs de produtos usadas pelo site aprovado.
          // O canario de migration-catalog sozinho nao detecta loja vazia.
          const items=await get('/api/products?source=d1&page=1&limit=48');
          assert.equal(items.configured,true,'Catálogo original nao conectado ao D1 staging');
          assert.ok(Array.isArray(items.products),'Resposta de catálogo inválida');
          assert.ok(items.products.length>0,'Catálogo original vazio apesar do D1 de teste');
          const kit=await get('/api/products?source=d1&category=Kits%20e%20presentes&page=1&limit=48');
          assert.equal(kit.configured,true);
          assert.ok(kit.products.every(p=>p.category==='Kits e presentes'));
          const home=await get('/api/products/home?source=d1');
          assert.equal(home.configured,true,'Home nao conectada ao D1');
          assert.ok(Array.isArray(home.featured)&&Array.isArray(home.newest));
          assert.ok(home.featured.length+home.newest.length>0,'Home vazia com produtos no D1');
          for(const page of ['/index.html','/loja.html','/colecao-kits-presentes.html']){
            const html=await fetch(base+page,{cache:'no-store'});
            assert.equal(html.status,200,page+' nao publicada');
            assert.match(await html.text(),/saluz-shell\\.js\\?v=20261022-d1-default/,page+' cache antigo');
          }
          console.log('Catálogo, home, coleções e versão dos scripts D1 staging OK.');
          const status=await get('/api/status');
          assert.equal(status.checkout_enabled,false);
          console.log('Homologacao D1/KV conectada, APIs respondendo; pagamentos bloqueados.');
          NODE
      - name: Preparar apenas os arquivos do painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          files = [
            'admin.html', 'admin.js', 'admin.css',
            'saluz-refinamento.css', 'saluz-admin-improvements.css',
            'saluz-control.css', 'saluz-mobile.css',
            'saluz-dashboard-pro.css', 'saluz-clean.css',
            'saluz-product-dialog.css', 'saluz-admin-extras.js',
            'saluz-mobile.js', 'saluz-studio.js', 'saluz-studio.css', 'saluz-simple.css',
            'saluz-campaigns.js', 'saluz-campaigns.css',
            'saluz-professional.js', 'saluz-professional.css',
            'favicon.svg', '_headers',
            'migration-lab.html','migration-lab.js','migration-lab.css'
          ]
          out = Path('saluz-admin-public')
          out.mkdir(exist_ok=True)
          for name in files:
            assert Path(name).exists(), f'Arquivo nao encontrado: {name}'
            shutil.copy2(name, out / name)
          shutil.copy2('admin.html', out / 'index.html')
          assert Path('admin-deploy/functions/api/[[path]].js').exists()
          shutil.copy2('admin-deploy/functions/api/[[path]].js','functions/api/[[path]].js')
          PY
      - name: Implantar painel em preview isolado
        run: |
          npx --yes wrangler@4 pages deploy saluz-admin-public \
            --project-name saluz-admin \
            --branch homologacao

      - name: Smoke de seguranca do laboratorio online
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://homologacao.saluz-admin.pages.dev';
          async function check(url){
            let last;
            for(let n=0;n<6;n++){
              try{const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(12000)});return r;}
              catch(e){last=e;await new Promise(r=>setTimeout(r,1600));}
            }
            throw last;
          }
          const lab=await check(base+'/migration-lab.html');
          assert.equal(lab.status,200,'Laboratorio nao publicado no preview');
          assert.match(await lab.text(),/Laboratório de migração/);
          const denied=await check(base+'/api/migration-admin/products');
          assert.equal(denied.status,401,'Endpoint administrativo sem autenticacao deve recusar acesso');
          const content=await check(base+'/api/migration-admin/content');
          assert.equal(content.status,401);
          const catalog=await check('https://homologacao.saluz-loja.pages.dev/api/migration-catalog');
          assert.equal(catalog.status,200);
          const list=await catalog.json();
          assert.equal(list.payments_enabled,false);
          console.log('Laboratorio publicado; acesso sem sessao bloqueado; checkout desativado.');
          NODE
