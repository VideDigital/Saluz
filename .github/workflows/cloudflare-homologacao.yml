name: SALUZ | Implantar homologação Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saluz-cloudflare-homologacao
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: saluz-homologacao
    env:
      CLOUDFLARE_ACCOUNT_ID: f84d79f13ae0a665e5046ebeb21ffddd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar autorização de implantação
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN no ambiente saluz-homologacao do GitHub."
            exit 1
          fi
      - name: Verificações antes da implantação
        run: node --test tests/*.test.mjs
      - name: Preparar somente arquivos públicos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          public = Path("saluz-public")
          public.mkdir(exist_ok=True)
          allowed = {".html",".css",".js",".svg",".png",".jpg",".jpeg",".webp",".ico",".txt",".woff2",".xml"}
          for item in Path(".").iterdir():
              if item.is_file() and (item.suffix.lower() in allowed or item.name in {"_headers","_redirects","robots.txt"}):
                  shutil.copy2(item,public/item.name)
          assert (public/"index.html").exists()
          assert (public/"admin.html").exists()
          assert (public/"loja.html").exists()
          assert (Path("functions")/"api"/"[[path]].js").exists()
          print("Arquivos publicáveis preparados. Functions serão descobertas pelo Wrangler na raiz.")
          PY
      - name: Implantar apenas no Pages SALUZ da Anny
        run: npx --yes wrangler@4 pages deploy saluz-public --project-name saluz-loja --branch main
